<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de perfil - Sesión 04</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="tarjeta">
    <div id="avatar" class="avatar">🧑‍💻</div>
    <h1 id="nombre">Alejandro Peñata</h1>
    <p class="rol">Aprendiz ADSO</p>
    <p class="ciudad">📍 Medellín</p>
    <h2>Habilidades</h2>
    <ul id="habilidades" class="habilidades">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>GitHub</li>
    </ul>
    <button id="btnTema" class="boton">🌙 Modo oscuro</button>
  </main>

  <script>
    const btnTema = document.getElementById('btnTema');
    if (btnTema) {
      btnTema.addEventListener('click', () => {
        document.body.classList.toggle('oscuro');
        if (document.body.classList.contains('oscuro')) {
          btnTema.textContent = '☀️ Modo claro';
        } else {
          btnTema.textContent = '🌙 Modo oscuro';
        }
      });
    }
  </script>
</body>
</html>
