<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Inscripcion Cursos</h1>
        <form action="#" id="formInscripcion">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3">
                    <small id="error-nombre" class="error"></small>
                </div>

                <div class="campo">
                    <label for="nombre">Documento</label>
                    <input type="text" id="documento" name="documento"  inputmode="numeric" required pattern="\d{6,10}" title="Obligatorio, solo números, 6 a 10 dígitos">
                    <small id="error-documento" class="error"></small>
                </div>

                <div class="campo">
                    <label for="correo">Correo Eletronico</label>
                    <input type="email" name="correo" id="correo" required>
                    <small id="error-correo" class="error"></small>
                </div>

                <div class="campo">
                    <label for="nacimiento">Celular</label>
                    <input type="tel" id="telefono" name="telefono" required
                    pattern="3[0-9]{9}" title="10 dígitos que empiecen por 3">
                    <small id="error-telefono" class="error"></small>
                </div>
            </fieldset>

            <fieldset>
                <legend>Curso</legend>
                <div class="campo">
                    <label for="tipo">Programa</label required>
                    <select name="tipo" id="tipo">
                        <option value="">Elige un a opción</option>
                        <option value="python">Python</option>
                        <option value="HTML y CSS">HTML y CSS</option>
                        <option value="JavaScript">JavaScript</option>
                    </select>
                </div>

                <div class="grupo">
                    <legend>Jornada</legend>
                    <label for="Mañana" class="opcion">
                        <input type="radio" name="jornada" id="Mañana" value="Mañana">Mañana
                    </label>

                    <label for="Tarde" class="opcion">
                        <input type="radio" name="jornada" id="Tarde" value="Tarde" checked>Tarde
                    </label>

                    <label for="Noche" class="opcion">
                        <input type="radio" name="jornada" id="Noche" value="Noche">Noche
                    </label>
                    <small id="error-jornada" class="error"></small>
                </div>

                <div class="grupo">
                    <legend>Autorizacion de Datos</legend>
                    <label for="" class="opcion">
                        <input type="checkbox" name="terminos" id="" value="acepto">Autorizo el tratamiento de mis datos personales
                    </div>
            </fieldset>
            <button type="submit" class="boton">Inscribirme</button>
        </form>

    </main>
</body>
</html>
